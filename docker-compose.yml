services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_ads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_ads"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-publisher:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "mock-publisher/server.js"]
    volumes:
      - ./:/app
    networks:
      default:
        aliases:
          - publisher1.local
          - publisher2.local
          - publisher3.local

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-publisher:
        condition: service_started
    environment:
      APP_ROLE: api
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_ads
      REDIS_URL: redis://redis:6379
      MARKETPLACE_CONCURRENCY: 10
      ADS_TXT_CONCURRENCY: 25
      HTTP_TIMEOUT_MS: 5000
      HTTP_MAX_RESPONSE_SIZE: 262144
      HTTP_RETRY_LIMIT: 3
      HTTP_RETRY_BASE_DELAY_MS: 250
      HTTP_REDIRECT_LIMIT: 5
      GLOBAL_RATE_LIMIT: 50
      PER_DOMAIN_RATE_LIMIT: 2
      RATE_LIMIT_SLOT_TTL_MS: 15000
      RATE_LIMIT_ACQUIRE_TIMEOUT_MS: 5000
      RATE_LIMIT_POLL_MS: 100
      QUEUE_ATTEMPTS: 5
      QUEUE_BACKOFF_MS: 1000
      SCHEDULER_POLL_INTERVAL_MS: 5000
      SCHEDULER_BATCH_SIZE: 100
      SCHEDULER_LOCK_TTL_MS: 30000
    command: ["node", "dist/main.js"]
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-publisher:
        condition: service_started
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_ads
      REDIS_URL: redis://redis:6379
      MARKETPLACE_CONCURRENCY: 10
      ADS_TXT_CONCURRENCY: 25
      HTTP_TIMEOUT_MS: 5000
      HTTP_MAX_RESPONSE_SIZE: 262144
      HTTP_RETRY_LIMIT: 3
      HTTP_RETRY_BASE_DELAY_MS: 250
      HTTP_REDIRECT_LIMIT: 5
      GLOBAL_RATE_LIMIT: 50
      PER_DOMAIN_RATE_LIMIT: 2
      RATE_LIMIT_SLOT_TTL_MS: 15000
      RATE_LIMIT_ACQUIRE_TIMEOUT_MS: 5000
      RATE_LIMIT_POLL_MS: 100
      QUEUE_ATTEMPTS: 5
      QUEUE_BACKOFF_MS: 1000
      SCHEDULER_POLL_INTERVAL_MS: 5000
      SCHEDULER_BATCH_SIZE: 100
      SCHEDULER_LOCK_TTL_MS: 30000
    command: ["node", "dist/main.js"]

  scheduler:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: scheduler
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_ads
      REDIS_URL: redis://redis:6379
      MARKETPLACE_CONCURRENCY: 10
      ADS_TXT_CONCURRENCY: 25
      HTTP_TIMEOUT_MS: 5000
      HTTP_MAX_RESPONSE_SIZE: 262144
      HTTP_RETRY_LIMIT: 3
      HTTP_RETRY_BASE_DELAY_MS: 250
      HTTP_REDIRECT_LIMIT: 5
      GLOBAL_RATE_LIMIT: 50
      PER_DOMAIN_RATE_LIMIT: 2
      RATE_LIMIT_SLOT_TTL_MS: 15000
      RATE_LIMIT_ACQUIRE_TIMEOUT_MS: 5000
      RATE_LIMIT_POLL_MS: 100
      QUEUE_ATTEMPTS: 5
      QUEUE_BACKOFF_MS: 1000
      SCHEDULER_POLL_INTERVAL_MS: 5000
      SCHEDULER_BATCH_SIZE: 100
      SCHEDULER_LOCK_TTL_MS: 30000
    command: ["node", "dist/main.js"]
